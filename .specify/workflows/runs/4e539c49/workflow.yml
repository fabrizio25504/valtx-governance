schema_version: '1.0'
workflow:
  id: speckit
  name: Full SDD Cycle
  version: 1.0.0
  author: GitHub
  description: "Runs specify \u2192 plan \u2192 tasks \u2192 taskstoissues \u2192\
    \ implement \u2192 converge loop"
requires:
  speckit_version: '>=0.8.5'
  integrations:
    any:
    - claude
    - copilot
    - gemini
    - opencode
inputs:
  spec:
    type: string
    required: true
    prompt: Describe what you want to build
  integration:
    type: string
    default: auto
    prompt: Integration to use (e.g. claude, copilot, gemini, opencode; 'auto' uses
      the project's initialized integration)
  scope:
    type: string
    default: full
    enum:
    - full
    - backend-only
    - frontend-only
steps:
- id: specify
  command: speckit.specify
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.spec }}'
- id: plan
  command: speckit.plan
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.spec }}'
- id: tasks
  command: speckit.tasks
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.spec }}'
- id: taskstoissues
  command: speckit.taskstoissues
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.spec }}'
- id: implement
  command: speckit.implement
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.spec }}'
- id: converge-loop
  type: do-while
  condition: '{{ steps.converge.output.tasks_added == true }}'
  steps:
  - id: converge
    command: speckit.converge
    integration: '{{ inputs.integration }}'
    input:
      args: '{{ inputs.spec }}'
  - id: implement-retry
    command: speckit.implement
    integration: '{{ inputs.integration }}'
    input:
      args: '{{ inputs.spec }}'
