id: POL-DATA-RET-002
titulo: Retención y minimización de datos personales
enforcement: MUST
triggers: [pii, datos_personales, ubicacion, perfil, retencion]
requisito: >
  Conservar datos personales solo el tiempo necesario para la finalidad
  declarada; definir plazo de retención y purga automática. Minimizar campos
  capturados al mínimo indispensable.
