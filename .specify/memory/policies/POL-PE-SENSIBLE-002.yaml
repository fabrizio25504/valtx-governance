requisito: Los datos sensibles exigen consentimiento expreso y POR ESCRITO (firma manuscrita/digital/electrónica).
  Aplicar cifrado y control de acceso estricto; minimizar o evitar el almacenamiento cuando sea posible.
fuente: 'Ley 29733 Art. 2.5 (definición de datos sensibles); DS 016-2024-JUS Título Preliminar Art. III
  (definiciones ampliadas: biométricos/neuronales)'
source_url: https://diariooficial.elperuano.pe/Normas/obtenerDocumento?idNorma=23
nota: El reglamento amplía la definición (biométricos que identifican, datos neuronales/emocionales).
patron_ears: WHERE el feature trata datos sensibles THE SYSTEM SHALL exigir consentimiento por escrito
  y cifrar el dato en reposo y tránsito.
