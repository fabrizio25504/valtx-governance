module: src/panel_de_estado_de.py
tipos:
  ConsentSummary:
    account: str
    status: str
    grant_date: str
    accepted_channels: list[str]
  RevocationResult:
    account: str
    new_status: str
    encrypted_log_id: str
  ConsentLogEntry:
    # Dato EN CLARO. El llamador nunca entrega el registro ya cifrado —
    # REQ-PAN-003 dice "THE SYSTEM SHALL cifrar", así que cifrar es
    # responsabilidad de save_encrypted_consent_record, no de quien lo llama.
    record_id: str
    payload: str
  MinimizationCheck:
    account: str
    marketing_status: str
funciones:
  get_consent_summary:
    params:
      account: str
    returns: ConsentSummary
    descripcion: devuelve el resumen del estado actual del consentimiento, fecha de otorgamiento y canales aceptados para la cuenta especificada
  revoke_marketing_consent:
    params:
      account: str
    returns: RevocationResult
    descripcion: devuelve el resultado de actualizar el estado a revocado y el identificador del log cifrado que deja constancia de la acción; internamente arma un ConsentLogEntry EN CLARO y se lo pasa a save_encrypted_consent_record para que ESA función lo cifre
  save_encrypted_consent_record:
    params:
      entry: ConsentLogEntry
    returns: bool
    descripcion: >
      CIFRA entry.payload (texto plano) con la clave activa y persiste el
      resultado cifrado en el almacenamiento en reposo; devuelve verdadero si
      el cifrado y la persistencia se completaron, falso si falló. Cifrar es
      responsabilidad de ESTA función (REQ-PAN-003 asigna la acción al
      sistema) — nunca recibe el dato ya cifrado, solo texto plano.
  verify_minimization_fields:
    params:
      account: str
      marketing_status: str
    returns: MinimizationCheck
    descripcion: devuelve la verificación de que unicamente se capturaron los campos mínimos necesarios (cuenta y estado de marketing)
