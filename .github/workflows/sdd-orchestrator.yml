name: SDD Orchestrator

# Corre los gates de gobernanza en cada PR (y manual). Los intakes externos ya no
# entran aquí: notion-feature -> agent-specify (redacta spec), linear-task -> agent-implement
# (implementa). Ambos abren PRs, y ESOS PRs son los que este Orchestrator valida.
on:
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      feature:
        description: "Carpeta del feature en specs/"
        default: "FEAT-042-geo-checkin"

permissions:
  contents: read
  pull-requests: write
  issues: write

# Feature a evaluar, resuelto según el disparador:
#  - repository_dispatch (Notion/Linear): client_payload.feature
#  - workflow_dispatch (manual): inputs.feature
#  - pull_request u otro: fallback al demo
env:
  FEATURE: ${{ github.event.client_payload.feature || github.event.inputs.feature || github.head_ref || 'FEAT-042-geo-checkin' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt

      # Traza el origen del disparo (útil para Notion/Linear)
      - name: Contexto del disparo
        run: |
          echo "Evento: ${{ github.event_name }}"
          echo "Feature: $FEATURE"
          echo "Prompt (si viene de Notion/Linear): ${{ github.event.client_payload.prompt }}"

      # --- GATE 1: Vigencia normativa (Capa 0) — 0 tokens LLM (global) ---
      - name: Gate vigencia normativa
        id: freshness
        run: python ci/policy_freshness.py

      # --- GATE 6: Unicidad global de REQ — global (recorre specs/ entero), fuera
      # del loop por feature de más abajo. Corre una vez por PR, no una vez por
      # feature: el invariante que protege (IDs/prefijos de REQ únicos) es del
      # repo completo, no de un feature aislado — igual que el Gate 1. ---
      - name: Gate unicidad global de REQ
        id: req_uniqueness
        run: python ci/check_req_uniqueness.py

      # --- GATE 2+3: Trazabilidad + Cobertura sobre TODOS los features ---
      - name: Gates por feature (trazabilidad + cobertura)
        id: gates
        run: |
          rc=0
          for d in specs/*/; do
            [ -f "${d}spec.md" ] || continue
            echo "===== $(basename "$d") ====="
            python ci/check_policy_citations.py "${d}spec.md" || rc=1
            python ci/check_traceability.py "${d}spec.md" src/ || rc=1
            python ci/coverage_graph.py "${d}spec.md" "$d" || rc=1
            python ci/check_scenarios.py "${d}spec.md" "$d" || rc=1
          done
          exit $rc

      # --- Write-back a Notion (feedback a Producto/Legal) — nunca rompe la CI ---
      # Corre siempre: si un gate falló, marca Bloqueado + cuál; si todo pasó, En curso.
      - name: Notion write-back
        if: always()
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB: ${{ vars.NOTION_DB }}
        run: |
          PR="${{ github.event.pull_request.html_url }}"
          if [ "${{ steps.freshness.outcome }}" = "failure" ]; then
            python ci/update_notion.py --feature "$FEATURE" --status bloqueado --gate "vigencia normativa" --pr-url "$PR"
          elif [ "${{ steps.req_uniqueness.outcome }}" = "failure" ]; then
            python ci/update_notion.py --feature "$FEATURE" --status bloqueado --gate "unicidad global de REQ" --pr-url "$PR"
          elif [ "${{ steps.gates.outcome }}" = "failure" ]; then
            python ci/update_notion.py --feature "$FEATURE" --status bloqueado --gate "trazabilidad/cobertura" --pr-url "$PR"
          else
            python ci/update_notion.py --feature "$FEATURE" --status en_curso --pr-url "$PR"
          fi

      # --- Write-back al GitHub Issue del feature (feedback a Ingeniería) — nunca rompe la CI ---
      - name: GitHub Issue write-back
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FID=$(echo "$FEATURE" | grep -oE 'FEAT-[0-9]+' | head -1)
          NUM=$(gh issue list --search "$FID in:title" --state all --json number -q '.[0].number' || true)
          if [ -z "$NUM" ]; then echo "Sin issue para $FID — nada que actualizar."; exit 0; fi
          PR="${{ github.event.pull_request.html_url }}"
          if [ "${{ steps.freshness.outcome }}" = "failure" ]; then
            gh issue comment "$NUM" --body "❌ **SDD**: bloqueado por gate **vigencia normativa**. [PR]($PR)"
          elif [ "${{ steps.req_uniqueness.outcome }}" = "failure" ]; then
            gh issue comment "$NUM" --body "❌ **SDD**: bloqueado por gate **unicidad global de REQ**. [PR]($PR)"
          elif [ "${{ steps.gates.outcome }}" = "failure" ]; then
            gh issue comment "$NUM" --body "❌ **SDD**: bloqueado por gate **trazabilidad/cobertura**. [PR]($PR)"
          else
            gh issue comment "$NUM" --body "🟡 **SDD**: gates verdes — en revisión humana / pendiente de merge. [PR]($PR)"
          fi

      # --- Mejoras del flujo (activar cuando haya secrets) ---
      # - name: SAST + secret scanning
      #   uses: github/codeql-action/analyze@v3
      # - name: Observabilidad de tokens
      #   run: python ci/token_meter.py   # emite costo/tokens del run del agente
