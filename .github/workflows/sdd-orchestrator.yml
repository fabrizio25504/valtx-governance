name: SDD Orchestrator

# Corre los mismos gates que ci/run_gates.py, en cada PR y ante disparadores
# externos (Notion/Linear via repository_dispatch).
on:
  pull_request:
    branches: [ main, dev ]
  repository_dispatch:
    types: [ notion-feature, linear-task ]
  workflow_dispatch:
    inputs:
      feature:
        description: "Carpeta del feature en specs/"
        default: "FEAT-042-geo-checkin"

permissions:
  contents: read
  pull-requests: write

# Feature a evaluar, resuelto según el disparador:
#  - repository_dispatch (Notion/Linear): client_payload.feature
#  - workflow_dispatch (manual): inputs.feature
#  - pull_request u otro: fallback al demo
env:
  FEATURE: ${{ github.event.client_payload.feature || github.event.inputs.feature || github.head_ref || 'FEAT-042-geo-checkin' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt

      # Traza el origen del disparo (útil para Notion/Linear)
      - name: Contexto del disparo
        run: |
          echo "Evento: ${{ github.event_name }}"
          echo "Feature: $FEATURE"
          echo "Prompt (si viene de Notion/Linear): ${{ github.event.client_payload.prompt }}"

      # --- GATE 1: Vigencia normativa (Capa 0) — 0 tokens LLM (global) ---
      - name: Gate vigencia normativa
        id: freshness
        run: python ci/policy_freshness.py

      # --- GATE 2+3: Trazabilidad + Cobertura sobre TODOS los features ---
      - name: Gates por feature (trazabilidad + cobertura)
        id: gates
        run: |
          rc=0
          for d in specs/*/; do
            [ -f "${d}spec.md" ] || continue
            echo "===== $(basename "$d") ====="
            python ci/check_traceability.py "${d}spec.md" src/ || rc=1
            python ci/coverage_graph.py "${d}spec.md" "$d" || rc=1
          done
          exit $rc

      # --- Write-back a Notion (feedback a Producto/Legal) — nunca rompe la CI ---
      # Corre siempre: si un gate falló, marca Bloqueado + cuál; si todo pasó, En curso.
      - name: Notion write-back
        if: always()
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.html_url }}"
          if [ "${{ steps.freshness.outcome }}" = "failure" ]; then
            python ci/update_notion.py --feature "$FEATURE" --status bloqueado --gate "vigencia normativa" --pr-url "$PR"
          elif [ "${{ steps.gates.outcome }}" = "failure" ]; then
            python ci/update_notion.py --feature "$FEATURE" --status bloqueado --gate "trazabilidad/cobertura" --pr-url "$PR"
          else
            python ci/update_notion.py --feature "$FEATURE" --status en_curso --pr-url "$PR"
          fi

      # --- Write-back a Linear (feedback a Ingeniería) — nunca rompe la CI ---
      - name: Linear write-back
        if: always()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          PR="${{ github.event.pull_request.html_url }}"
          if [ "${{ steps.freshness.outcome }}" = "failure" ]; then
            python ci/sync_linear.py --feature "$FEATURE" --status bloqueado --gate "vigencia normativa" --pr-url "$PR"
          elif [ "${{ steps.gates.outcome }}" = "failure" ]; then
            python ci/sync_linear.py --feature "$FEATURE" --status bloqueado --gate "trazabilidad/cobertura" --pr-url "$PR"
          else
            python ci/sync_linear.py --feature "$FEATURE" --status en_curso --pr-url "$PR"
          fi

      # --- Mejoras del flujo (activar cuando haya secrets) ---
      # - name: SAST + secret scanning
      #   uses: github/codeql-action/analyze@v3
      # - name: Observabilidad de tokens
      #   run: python ci/token_meter.py   # emite costo/tokens del run del agente
