name: SDD Agent — Implement

# Cierra el brazo de implementación: ante un issue de GitHub con label "implement"
# (título con FEAT-###) o disparo manual, recupera contexto del KB (Vertex), el agente
# (aider — AGNÓSTICO al LLM) implementa las tasks citando REQ, y abre un PR que pasa
# por los gates del SDD Orchestrator.
on:
  issues:
    types: [ labeled ]
  workflow_dispatch:
    inputs:
      feature:
        description: "Carpeta del feature en specs/"
        default: "FEAT-044-data-export"
      model:
        description: "Modelo del agente (aider, prefijo openai/ para APIs compatibles): openai/z-ai/glm-5.2 (NVIDIA NIM), gpt-4o-mini, claude-3-5-sonnet-20241022…"
        default: "openai/z-ai/glm-5.2"

permissions:
  contents: write
  pull-requests: write

env:
  FEATURE: ${{ github.event.issue.title || github.event.inputs.feature || 'FEAT-044-data-export' }}
  AGENT_MODEL: ${{ github.event.inputs.model || 'openai/z-ai/glm-5.2' }}

jobs:
  implement:
    if: github.event_name != 'issues' || github.event.label.name == 'implement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt aider-chat

      # 0) Resuelve el FEATURE a la carpeta real de specs/.
      #    Permite que el disparo traiga solo "FEAT-044" (p. ej. desde el título de un
      #    issue de GitHub) y aquí se expande a "FEAT-044-data-export".
      - name: Resolver carpeta del feature
        run: |
          # ID corto (FEAT-###), la misma clave que agent-specify.yml usa para
          # token_meter. Sin esto, metrics/token_usage.jsonl termina con dos
          # claves distintas para el mismo feature ("FEAT-052" del stage specify
          # vs "FEAT-052-job-programado-que-aplica" del stage implement) y
          # report() lo cuenta como si fueran dos features separados.
          ID=$(echo "$FEATURE" | grep -oE 'FEAT-[0-9]+' | head -1)
          echo "FEAT_ID=$ID" >> "$GITHUB_ENV"
          if [ ! -d "specs/$FEATURE" ]; then
            D=$(ls -d specs/${ID}-*/ 2>/dev/null | head -1)
            if [ -n "$D" ]; then
              echo "FEATURE=$(basename "$D")" >> "$GITHUB_ENV"
              echo "Resuelto: $FEATURE -> $(basename "$D")"
            else
              echo "::error::No existe carpeta specs/ para '$FEATURE' (ni specs/${ID}-*/). El feature necesita su spec antes de que el agente lo implemente."
              exit 1
            fi
          fi

      # 1) RETRIEVAL — contexto del KB (Vertex AI Search)
      - name: Gather context (Vertex)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python ci/gather_context.py --feature "$FEATURE" --top 8 > context_kb.md || true
          echo "----- contexto recuperado -----"; cat context_kb.md

      # 2) Rama de trabajo
      - name: Crear rama
        run: |
          git config user.name  "sdd-agent"
          git config user.email "sdd-agent@valtx.pe"
          echo "BRANCH=feature/${FEATURE}-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          git checkout -b "feature/${FEATURE}-${GITHUB_RUN_ID}"

      # 2b) CONTEXTO CONSTITUCIONAL — bundler selectivo (principios + Policy Cards
      # relevantes al feature, vía mapea_principio). Fuente única de verdad: si
      # constitution.md cambia, esto lo refleja solo, sin copias a mano en el --message.
      # Sin `|| true` a propósito: si el spec no declara tags, preferimos que el
      # workflow se caiga a que el agente escriba código sin principios en silencio.
      - name: Contexto constitucional (bundler)
        run: python ci/context_bundler.py "specs/$FEATURE/spec.md" --out constitution_context.md

      # 3) AGENTE (aider, agnóstico) — implementa citando REQ, con el spec + gherkin + KB como contexto
      - name: Agente implementa (aider)
        env:
          OPENAI_API_BASE: https://integrate.api.nvidia.com/v1
          OPENAI_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          READS="--read specs/$FEATURE/spec.md --read constitution_context.md"
          [ -f context_kb.md ] && READS="$READS --read context_kb.md"
          for f in specs/$FEATURE/*.feature; do [ -f "$f" ] && READS="$READS --read $f"; done
          [ -f "specs/$FEATURE/contracts.yaml" ] && READS="$READS --read specs/$FEATURE/contracts.yaml"
          # Captura el output de aider (incluye su reporte de tokens/costo) para medirlo.
          aider --model "$AGENT_MODEL" --yes-always --no-auto-commit --no-check-update \
            --no-stream --no-analytics $READS \
            --message "Completa la implementacion en el modulo declarado en el campo 'module:' del front-matter de specs/$FEATURE/spec.md (ya existe como STUB generado por agent-specify: firmas vacías que los step definitions de specs/$FEATURE/steps/ ya importan). specs/$FEATURE/contracts.yaml es el CONTRATO que manda: los nombres de campo de cada tipo, la firma (params/returns) de cada funcion, y la semantica del retorno descrita en su 'descripcion:' son la fuente de verdad — no las tuyas propias. Si el STUB o los step definitions difieren del contrato, es el CODIGO el que se corrige para calzar con el contrato, nunca al reves. Respeta esas firmas (nombres y parametros) — no las renombres ni cambies su ubicacion — y completa su cuerpo para cumplir los requisitos del feature segun spec.md, su .feature y el contrato. Cumple TODAS las reglas de constitution_context.md: la CI las verifica y bloquea el merge si no se cumplen. NO modifiques .specify/memory/, ci/, ni otros features." \
            2>&1 | tee aider_out.txt

      # 3b) OBSERVABILIDAD — mide tokens/costo REAL del run (dato para el modelo de costo).
      - name: Medir costo (token_meter)
        if: always()
        run: |
          python ci/token_meter.py --feature "$FEAT_ID" --stage implement \
            --model "$AGENT_MODEL" --aider-log aider_out.txt --summary-out cost_comment.md || true

      # 4) Commit + PR → dispara el SDD Orchestrator (los gates)
      # Usa el PAT personal (no el GITHUB_TOKEN del bot): la restricción de la org
      # "Actions no puede crear PRs" aplica solo al bot; con tu PAT el PR se crea como tú.
      - name: Abrir PR
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
        run: |
          rm -f aider_out.txt        # no versionar el log crudo; sí las métricas (metrics/*.jsonl)
          git add -A
          git commit -m "feat(${FEATURE}): implementación por agente SDD (${AGENT_MODEL})" || { echo "sin cambios"; exit 0; }
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "feat: ${FEATURE} (agente · ${AGENT_MODEL})" \
            --body "Implementación por el agente (aider, modelo ${AGENT_MODEL}). Contexto vía Vertex AI Search. Sujeto a los gates (vigencia · consistencia normativa · trazabilidad · cobertura).")
          echo "PR: $PR_URL"
          [ -f cost_comment.md ] && gh pr comment "$PR_URL" --body-file cost_comment.md || true
