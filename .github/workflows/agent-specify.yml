name: SDD Agent — Specify

# Cierra el ÚLTIMO tramo manual: convierte un PROMPT (desde Notion/Linear o manual) en
# el borrador de spec.md + .feature (EARS + Gherkin) citando SOLO las Policy Cards que la
# Capa 0 determina aplicables, y abre un PR para revisión humana. El agente REDACTA el spec;
# el humano lo aprueba. Después, agent-implement.yml lo implementa.
on:
  repository_dispatch:
    types: [ notion-feature ]
  workflow_dispatch:
    inputs:
      feature:
        description: "ID del feature (ej. FEAT-045)"
        required: true
      prompt:
        description: "Qué se quiere construir (lenguaje natural)"
        required: true
      title:
        description: "Título corto (opcional; para el nombre de carpeta)"
        default: ""
      model:
        description: "Modelo del agente (aider, prefijo openai/ para APIs compatibles): openai/z-ai/glm-5.2 (NVIDIA NIM), gpt-4o-mini, claude-3-5-sonnet-20241022…"
        default: "openai/z-ai/glm-5.2"

permissions:
  contents: write
  pull-requests: write

env:
  FEATURE: ${{ github.event.client_payload.feature || github.event.inputs.feature }}
  PROMPT:  ${{ github.event.client_payload.prompt  || github.event.inputs.prompt }}
  TITLE:   ${{ github.event.client_payload.title   || github.event.inputs.title }}
  AGENT_MODEL: ${{ github.event.client_payload.model || github.event.inputs.model || 'openai/z-ai/glm-5.2' }}

jobs:
  specify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt aider-chat

      # 1) Resuelve ID + slug de carpeta; corta si el spec ya existe (idempotente).
      - name: Preparar carpeta del feature
        run: |
          ID=$(echo "$FEATURE" | grep -oE 'FEAT-[0-9]+' | head -1)
          AUTO_ID=false
          if [ -z "$ID" ]; then
            # Sin FEAT-### explícito (ej. Notion/n8n con solo texto libre): autogenera
            # el siguiente número. Mismo algoritmo que create-new-feature.sh de spec-kit
            # (escanea specs/, toma el más alto, +1, padding 3 dígitos), adaptado al
            # prefijo FEAT- de este repo (spec-kit escanea "NNN-", no "FEAT-NNN-").
            AUTO_ID=true
            HIGHEST=0
            for dir in specs/FEAT-*/; do
              [ -d "$dir" ] || continue
              n=$(basename "$dir" | sed -nE 's/^FEAT-([0-9]+)-.*/\1/p')
              [ -n "$n" ] && [ "$((10#$n))" -gt "$HIGHEST" ] && HIGHEST=$((10#$n))
            done
            NEXT=$(printf "%03d" $((HIGHEST + 1)))
            ID="FEAT-${NEXT}"
            echo "Sin FEAT-### en '$FEATURE' — autogenerado: $ID"
          fi
          if ls -d specs/${ID}-*/ >/dev/null 2>&1; then
            echo "Ya existe spec para $ID ($(ls -d specs/${ID}-*/)). Nada que generar."; exit 0
          fi
          BASE="${TITLE:-$PROMPT}"
          if [ "$AUTO_ID" = true ]; then
            [ -n "$BASE" ] || BASE="$FEATURE"
            # ponytail: kebab-case simple (primeras 2-4 palabras), sin el filtro de
            # stop-words de spec-kit — agregar si el slug generado sale poco descriptivo.
            SLUG=$(echo "$BASE" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-*//;s/-*$//' | tr '-' '\n' | grep -v '^$' | head -4 | tr '\n' '-' | sed 's/-$//')
          else
            SLUG=$(echo "$BASE" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-*//;s/-*$//' | cut -c1-40 | sed 's/-*$//')
          fi
          [ -z "$SLUG" ] && SLUG="feature"
          echo "FEAT_ID=$ID" >> "$GITHUB_ENV"
          echo "SPEC_DIR=specs/${ID}-${SLUG}" >> "$GITHUB_ENV"
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          echo "Generaré: specs/${ID}-${SLUG}/"

      # 1b) Sella el Feature ID en la fila de Notion que originó este run, para que
      # update_notion.py (find_page) la encuentre después en vez de duplicarla.
      # Sin notion_page_id (runs por workflow_dispatch manual) no hay fila que sellar:
      # ahí create_page() crear la fila nueva es el comportamiento correcto.
      - name: Sellar Feature ID en Notion
        if: env.SPEC_DIR != '' && github.event.client_payload.notion_page_id != ''
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PAGE_ID: ${{ github.event.client_payload.notion_page_id }}
        run: |
          curl -sS -X PATCH "https://api.notion.com/v1/pages/$PAGE_ID" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "{\"properties\":{\"Feature ID\":{\"rich_text\":[{\"text\":{\"content\":\"$FEAT_ID\"}}]}}}" \
            -o /dev/null -w "[notion] Feature ID=$FEAT_ID → HTTP %{http_code}\n"

      # 2) CAPA 0 — router determinista: qué Policy Cards aplican a este prompt (0 tokens LLM).
      - name: Router de aplicabilidad (Capa 0)
        if: env.SPEC_DIR != ''
        run: |
          mkdir -p "$SPEC_DIR"
          python ci/policy_router.py --prompt "$PROMPT" > capa0_context.md
          echo "TAGS=$(python ci/policy_router.py --prompt "$PROMPT" --format tags)" >> "$GITHUB_ENV"
          echo "POLICIES=$(python ci/policy_router.py --prompt "$PROMPT" --format json | python -c 'import sys,json;print(",".join(json.load(sys.stdin)["policies"]))')" >> "$GITHUB_ENV"
          echo "----- Capa 0 -----"; cat capa0_context.md

      # 3) AGENTE redacta spec.md + .feature (agnóstico, aider). Cita solo las policies del router.
      - name: Agente redacta el spec
        if: env.SPEC_DIR != ''
        env:
          OPENAI_API_BASE: https://integrate.api.nvidia.com/v1
          OPENAI_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          aider --model "$AGENT_MODEL" --yes-always --no-auto-commit --no-check-update \
            --no-stream --no-analytics \
            --read .specify/templates/spec-template.md --read capa0_context.md \
            --file "$SPEC_DIR/spec.md" --file "$SPEC_DIR/${SLUG}.feature" \
            --message "Redacta el SPEC del feature $FEAT_ID a partir de este requerimiento del usuario: \"$PROMPT\".
            Escribe DOS archivos:
            A) $SPEC_DIR/spec.md con front-matter YAML: id: $FEAT_ID | titulo | tags: [$TAGS] | policies: [$POLICIES] | owner: producto@valtx.pe | estado: draft. Luego seccion Contexto, seccion 'Requisitos (EARS)' y una tabla 'Normas cumplidas'.
            B) $SPEC_DIR/${SLUG}.feature en Gherkin español (primera linea '# language: es').
            REGLAS OBLIGATORIAS que la CI verifica y bloquea:
            (1) Cada requisito es EARS ('WHEN/WHERE/IF ... THE SYSTEM SHALL ...') con id REQ-<AREA>-### (AREA = 3-4 letras mayusculas coherentes, p.ej. REQ-EXP-001).
            (2) La lista de policies aprobadas por el router es: [$POLICIES]. Si NO esta vacia, cada REQ cita en su texto UNA policy de esa lista con su articulo (usa el bloque 'CAPA 0'). Si esta VACIA, el feature NO toca normativa: NO cites NINGUNA policy, NO menciones POL-xx, NO inventes leyes ni articulos, y deja 'policies: []' y la seccion 'Normas cumplidas' con 'Ninguna norma aplicable (sin datos personales)'. La CI BLOQUEA cualquier POL-xx que no este en [$POLICIES].
            (3) El .feature tiene EXACTAMENTE un Escenario por cada REQ, etiquetado con '@REQ-<AREA>-###' identico al del spec (el gate de cobertura exige 100%).
            (4) NO escribas codigo de implementacion, NO toques ci/ ni .specify/memory/ ni otros features. Solo estos dos archivos." \
            2>&1 | tee aider_out.txt

      # 3b) OBSERVABILIDAD — costo real de redactar el spec.
      - name: Medir costo (token_meter)
        if: always() && env.SPEC_DIR != ''
        run: |
          python ci/token_meter.py --feature "$FEAT_ID" --stage specify \
            --model "$AGENT_MODEL" --aider-log aider_out.txt --summary-out cost_comment.md || true

      # 4) PR para revisión humana (con PAT personal → evita la restricción org de Actions).
      - name: Abrir PR del spec
        if: env.SPEC_DIR != ''
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
        run: |
          git config user.name  "sdd-agent"
          git config user.email "sdd-agent@valtx.pe"
          BRANCH="spec/${FEAT_ID}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          rm -f aider_out.txt capa0_context.md
          git add -A
          git commit -m "spec(${FEAT_ID}): borrador generado por agente (${AGENT_MODEL})" || { echo "sin cambios"; exit 0; }
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "spec: ${FEAT_ID} (borrador · agente)" \
            --body "Borrador de spec generado desde el prompt del usuario. Capa 0 aplicó: ${POLICIES:-(ninguna)}. **Revisión humana requerida** antes de implementar. Los gates corren en draft (consistencia normativa + cobertura EARS↔Gherkin 100%; implementación aún no exigida).")
          echo "PR: $PR_URL"
          [ -f cost_comment.md ] && gh pr comment "$PR_URL" --body-file cost_comment.md || true
