name: SDD Agent — Specify

# Cierra el ÚLTIMO tramo manual: convierte un PROMPT (desde Notion/Linear o manual) en
# el borrador de spec.md + .feature (EARS + Gherkin) citando SOLO las Policy Cards que la
# Capa 0 determina aplicables, y abre un PR para revisión humana. El agente REDACTA el spec;
# el humano lo aprueba. Después, agent-implement.yml lo implementa.
on:
  repository_dispatch:
    types: [ notion-feature ]
  workflow_dispatch:
    inputs:
      feature:
        description: "ID del feature (ej. FEAT-045)"
        required: true
      prompt:
        description: "Qué se quiere construir (lenguaje natural)"
        required: true
      title:
        description: "Título corto (opcional; para el nombre de carpeta)"
        default: ""
      model:
        description: "Modelo del agente (aider, prefijo openai/ para APIs compatibles): openai/z-ai/glm-5.2 (NVIDIA NIM), gpt-4o-mini, claude-3-5-sonnet-20241022…"
        default: "openai/z-ai/glm-5.2"

permissions:
  contents: write
  pull-requests: write

env:
  FEATURE: ${{ github.event.client_payload.feature || github.event.inputs.feature }}
  PROMPT:  ${{ github.event.client_payload.prompt  || github.event.inputs.prompt }}
  TITLE:   ${{ github.event.client_payload.title   || github.event.inputs.title }}
  AGENT_MODEL: ${{ github.event.client_payload.model || github.event.inputs.model || 'openai/z-ai/glm-5.2' }}

jobs:
  specify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt aider-chat

      # 1) Resuelve ID + slug de carpeta; corta si el spec ya existe (idempotente).
      - name: Preparar carpeta del feature
        run: |
          ID=$(echo "$FEATURE" | grep -oE 'FEAT-[0-9]+' | head -1)
          AUTO_ID=false
          if [ -z "$ID" ]; then
            # Sin FEAT-### explícito (ej. Notion/n8n con solo texto libre): autogenera
            # el siguiente número. Mismo algoritmo que create-new-feature.sh de spec-kit
            # (escanea specs/, toma el más alto, +1, padding 3 dígitos), adaptado al
            # prefijo FEAT- de este repo (spec-kit escanea "NNN-", no "FEAT-NNN-").
            AUTO_ID=true
            HIGHEST=0
            for dir in specs/FEAT-*/; do
              [ -d "$dir" ] || continue
              n=$(basename "$dir" | sed -nE 's/^FEAT-([0-9]+)-.*/\1/p')
              [ -n "$n" ] && [ "$((10#$n))" -gt "$HIGHEST" ] && HIGHEST=$((10#$n))
            done
            NEXT=$(printf "%03d" $((HIGHEST + 1)))
            ID="FEAT-${NEXT}"
            echo "Sin FEAT-### en '$FEATURE' — autogenerado: $ID"
          fi
          if ls -d specs/${ID}-*/ >/dev/null 2>&1; then
            echo "Ya existe spec para $ID ($(ls -d specs/${ID}-*/)). Nada que generar."; exit 0
          fi
          BASE="${TITLE:-$PROMPT}"
          if [ "$AUTO_ID" = true ]; then
            [ -n "$BASE" ] || BASE="$FEATURE"
            # ponytail: kebab-case simple (primeras 2-4 palabras), sin el filtro de
            # stop-words de spec-kit — agregar si el slug generado sale poco descriptivo.
            SLUG=$(echo "$BASE" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-*//;s/-*$//' | tr '-' '\n' | grep -v '^$' | head -4 | tr '\n' '-' | sed 's/-$//')
          else
            SLUG=$(echo "$BASE" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-*//;s/-*$//' | cut -c1-40 | sed 's/-*$//')
          fi
          [ -z "$SLUG" ] && SLUG="feature"
          MODNAME=$(echo "$SLUG" | tr '-' '_')
          echo "FEAT_ID=$ID" >> "$GITHUB_ENV"
          echo "SPEC_DIR=specs/${ID}-${SLUG}" >> "$GITHUB_ENV"
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          echo "MODULE=src/${MODNAME}.py" >> "$GITHUB_ENV"
          echo "STEPS_FILE=specs/${ID}-${SLUG}/steps/test_${MODNAME}_steps.py" >> "$GITHUB_ENV"
          echo "CONTRACTS_FILE=specs/${ID}-${SLUG}/contracts.yaml" >> "$GITHUB_ENV"
          echo "Generaré: specs/${ID}-${SLUG}/ (module: src/${MODNAME}.py)"

      # 1b) Sella el Feature ID en la fila de Notion que originó este run, para que
      # update_notion.py (find_page) la encuentre después en vez de duplicarla.
      # Sin notion_page_id (runs por workflow_dispatch manual) no hay fila que sellar:
      # ahí create_page() crear la fila nueva es el comportamiento correcto.
      - name: Sellar Feature ID en Notion
        if: env.SPEC_DIR != '' && github.event.client_payload.notion_page_id != ''
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PAGE_ID: ${{ github.event.client_payload.notion_page_id }}
        run: |
          curl -sS -X PATCH "https://api.notion.com/v1/pages/$PAGE_ID" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "{\"properties\":{\"Feature ID\":{\"rich_text\":[{\"text\":{\"content\":\"$FEAT_ID\"}}]}}}" \
            -o /dev/null -w "[notion] Feature ID=$FEAT_ID → HTTP %{http_code}\n"

      # 2) CAPA 0 — router híbrido: determinista (triggers, 0 tokens) + pase semántico
      # opcional que solo AGREGA cobertura, nunca resta lo que el determinista disparó
      # (ver ci/semantic_router.py). Una sola invocación: el md va a stdout, el JSON
      # estructurado a capa0.json, y de ahí derivamos TAGS/POLICIES/ROUTER_MODO — así
      # evitamos 3 llamadas al modelo por feature (una por --format que se necesitaba).
      - name: Router de aplicabilidad (Capa 0)
        if: env.SPEC_DIR != ''
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SDD_ROUTER_SEMANTIC: ${{ vars.SDD_ROUTER_SEMANTIC || '1' }}
        run: |
          mkdir -p "$SPEC_DIR/steps"
          python ci/semantic_router.py --prompt "$PROMPT" --json-out capa0.json > capa0_context.md
          echo "TAGS=$(python -c 'import json;print(",".join(json.load(open("capa0.json"))["tags"]))')" >> "$GITHUB_ENV"
          echo "POLICIES=$(python -c 'import json;print(",".join(json.load(open("capa0.json"))["policies"]))')" >> "$GITHUB_ENV"
          echo "ROUTER_MODO=$(python -c 'import json;print(json.load(open("capa0.json"))["modo"])')" >> "$GITHUB_ENV"
          echo "----- Capa 0 -----"; cat capa0_context.md

      # 2b) Prefijos de REQ ya usados por otros features — cálculo determinista (grep,
      # 0 tokens LLM), mismo patrón que el router de la Capa 0: se lo inyectamos al
      # agente en el --message en vez de confiar en que "elija bien" sin esa lista.
      # Sin esto, un prefijo repetido (p.ej. REQ-EXP-### ya usado por otro feature)
      # pasa desapercibido hasta que ci/check_req_uniqueness.py (Gate 6) lo bloquea.
      - name: Prefijos de REQ ya usados (evitar colisión)
        if: env.SPEC_DIR != ''
        run: |
          USED_PREFIXES=$(grep -rohE 'REQ-[A-Z]+-' specs/*/spec.md 2>/dev/null | sort -u | tr '\n' ' ')
          echo "USED_PREFIXES=$USED_PREFIXES" >> "$GITHUB_ENV"
          echo "Prefijos REQ ya usados: ${USED_PREFIXES:-(ninguno)}"

      # 3) AGENTE redacta spec.md + .feature (agnóstico, aider). Cita solo las policies del router.
      - name: Agente redacta el spec
        if: env.SPEC_DIR != ''
        env:
          OPENAI_API_BASE: https://integrate.api.nvidia.com/v1
          OPENAI_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          aider --model "$AGENT_MODEL" --yes-always --no-auto-commit --no-check-update \
            --no-stream --no-analytics \
            --read .specify/templates/spec-template.md --read capa0_context.md \
            --file "$SPEC_DIR/spec.md" --file "$SPEC_DIR/${SLUG}.feature" \
            --file "$CONTRACTS_FILE" --file "$STEPS_FILE" --file "$MODULE" \
            --message "Redacta el SPEC del feature $FEAT_ID a partir de este requerimiento del usuario: \"$PROMPT\".
            Escribe CINCO archivos, EN ESTE ORDEN (cada uno depende del anterior — no los redactes en paralelo inventando nombres por separado):
            A) $SPEC_DIR/spec.md con front-matter YAML: id: $FEAT_ID | titulo | tags: [$TAGS] | policies: [$POLICIES] | owner: producto@valtx.pe | estado: draft | module: $MODULE. Luego seccion Contexto, seccion 'Requisitos (EARS)' y una tabla 'Normas cumplidas'.
            B) $SPEC_DIR/${SLUG}.feature en Gherkin español. Empieza EXACTAMENTE así (plantilla obligatoria, copia estas dos lineas literal):
               # language: es
               Característica: <titulo del feature>
               Con '# language: es', la palabra clave de la primera linea de contenido es 'Característica:' — NUNCA 'Feature:' (esa es la palabra clave en ingles y con el header en español el parser no la reconoce, rompe la lectura de TODO el archivo). El resto de palabras clave tambien van en español: 'Escenario:', 'Dado', 'Cuando', 'Entonces', 'Y'.
            C) $CONTRACTS_FILE — el CONTRATO DE DATOS del feature (formato YAML). El spec (A) esta en EARS/castellano y NO tiene nombres de campo: sin este archivo, los steps (D) y el modulo (E) inventan cada uno su propio esquema por separado y terminan en desacuerdo (esto YA paso: un feature con steps asumiendo {id, user, date, expired} y el modulo implementando {user_id, timestamp, action, ip_address, is_expired} — los escenarios fallaron en Gate 5 modo CODE). Estructura obligatoria:
               module: $MODULE
               tipos:
                 <NombreDeEntidad>: {<campo>: <tipo python: str/int/bool/float>, ...}   # una entrada por cada estructura de datos que el feature use
               funciones:
                 <nombre_funcion>:
                   params: {<param>: <tipo, ej. 'list[NombreDeEntidad]' o 'str'>, ...}
                   returns: <tipo>
                   descripcion: <UNA linea en lenguaje de negocio de que devuelve concretamente la funcion — no repitas el tipo, decis el SIGNIFICADO. Ej.: 'devuelve los registros que se CONSERVAN tras la purga, no los purgados'>
               La descripcion: es OBLIGATORIA para cada funcion y no es decorativa: nombres de funcion ambiguos (ej. run_retention_job) no dicen por si solos si el retorno son los registros purgados o los conservados, y esa ambiguedad semantica — no solo la de tipos — es la causa real del desacuerdo entre steps y modulo.
               REGLA DE RESPONSABILIDAD (critica, ya causo un bug real): la responsabilidad que declares en cada funcion tiene que coincidir con quien ejecuta la accion segun el REQ correspondiente. Si un REQ dice 'THE SYSTEM SHALL cifrar/validar/calcular/purgar X', la funcion que lo implementa tiene que RECIBIR X sin hacer y hacerlo ella misma — nunca recibir X ya hecho como parametro (ej. un REQ que dice 'el sistema cifra los registros' exige una funcion que reciba el dato EN CLARO y devuelva/persista el cifrado; si el parametro ya se llama 'encrypted_data' o similar, le diste la responsabilidad al LLAMADOR y la funcion pasa a solo validar — nadie puede escribir un test honesto que verifique el REQ, porque la accion que el REQ pide ya no la hace nadie en el modulo).
            D) $STEPS_FILE — step definitions pytest-bdd que cubren TODAS las frases (Dado/Cuando/Entonces) del .feature del punto B. Los nombres de campo y las firmas que uses ACA salen EXCLUSIVAMENTE de $CONTRACTS_FILE (punto C) — no los inventes de nuevo aunque te parezcan razonables; si un dato no esta en el contrato, agregalo primero al contrato. Reglas de este archivo:
               - Imports al TOPE del archivo (nunca dentro del cuerpo de un step): 'from pytest_bdd import scenarios, given, when, then' y 'from $MODULE_IMPORT import <las funciones que uses>' (MODULE_IMPORT = la ruta de $MODULE sin 'src/' ni '.py', con puntos, precedida por 'src.', ej. src/foo_bar.py -> src.foo_bar).
               - 'scenarios(\"../${SLUG}.feature\")' (ruta relativa desde steps/ hacia el .feature del directorio padre).
               - Cada @given/@when construye o mantiene un estado de prueba (fixture simple, dict o variable de módulo) que los @then puedan inspeccionar, usando los nombres de campo de $CONTRACTS_FILE.
               - Un @given NUNCA construye su fixture llamando a una funcion de $MODULE (el modulo bajo prueba): el fixture se arma con datos LITERALES (strings, numeros, dicts a mano). Si para armar un dato de entrada valido no te alcanza con literales y necesitas invocar una funcion del propio modulo (ej. para 'cifrar' o 'generar' el dato antes de pasarlo), es señal de que el contrato le dio la responsabilidad a la funcion equivocada (ver REGLA DE RESPONSABILIDAD en el punto C) — arreglá el contrato, no el @given.
               - Cada @then contiene una aserción REAL (assert) sobre el resultado que devuelven las funciones de $MODULE, consistente con la 'descripcion:' de cada funcion en el contrato — NUNCA 'pass' ni un assert trivial (assert True). Si el escenario no tiene nada que verificar todavía, es un error tuyo: el escenario en verde sin implementación es exactamente lo que el Gate 5 bloquea.
            E) $MODULE — STUB del módulo que implementará el feature: define EXACTAMENTE las funciones descritas en 'funciones:' de $CONTRACTS_FILE (mismos nombres, mismos params — no otros), y haz que CADA UNA devuelva un valor vacío/neutro (None, {}, [], '', 0, False) — nunca 'raise NotImplementedError'. El objetivo es que la ejecución llegue hasta el assert del step @then y falle ahí (rojo de TDD legítimo), no que explote antes por una excepción. Este archivo NO debe citar ningun REQ-XXX-### en comentarios (ni citar ninguna Policy Card): es un stub vacío, todavía no es la implementación citada que exige el gate de trazabilidad.
            REGLAS OBLIGATORIAS que la CI verifica y bloquea:
            (1) Cada requisito es EARS ('WHEN/WHERE/IF ... THE SYSTEM SHALL ...') con id REQ-<AREA>-### (AREA = 3-4 letras mayusculas coherentes, p.ej. REQ-EXP-001). Prefijos REQ-<AREA> YA usados por otros features (elegi un AREA que NO este en esta lista, es el namespace del feature): $USED_PREFIXES
            (2) La lista de policies aprobadas por el router es: [$POLICIES]. Si NO esta vacia, cada REQ cita en su texto UNA policy de esa lista con su articulo (usa el bloque 'CAPA 0'). Si esta VACIA, el feature NO toca normativa: NO cites NINGUNA policy, NO menciones POL-xx, NO inventes leyes ni articulos, y deja 'policies: []' y la seccion 'Normas cumplidas' con 'Ninguna norma aplicable (sin datos personales)'. La CI BLOQUEA cualquier POL-xx que no este en [$POLICIES].
            (3) El .feature tiene EXACTAMENTE un Escenario por cada REQ, etiquetado con '@REQ-<AREA>-###' identico al del spec (el gate de cobertura exige 100%).
            (4) $STEPS_FILE debe recolectar y FALLAR (no pasar, no quedar undefined) todos los escenarios contra el STUB de $MODULE: es el rojo esperado antes de implementar.
            (5) NO escribas la implementacion real en $MODULE (solo el stub descrito en E), NO toques ci/ ni .specify/memory/ ni otros features. Solo estos cinco archivos." \
            2>&1 | tee aider_out.txt

      # 3b) OBSERVABILIDAD — costo real de redactar el spec.
      - name: Medir costo (token_meter)
        if: always() && env.SPEC_DIR != ''
        run: |
          python ci/token_meter.py --feature "$FEAT_ID" --stage specify \
            --model "$AGENT_MODEL" --aider-log aider_out.txt --summary-out cost_comment.md \
            --router-modo "$ROUTER_MODO" || true

      # 4) PR para revisión humana (con PAT personal → evita la restricción org de Actions).
      - name: Abrir PR del spec
        if: env.SPEC_DIR != ''
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
        run: |
          git config user.name  "sdd-agent"
          git config user.email "sdd-agent@valtx.pe"
          BRANCH="spec/${FEAT_ID}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          rm -f aider_out.txt capa0_context.md capa0.json
          git add -A
          git commit -m "spec(${FEAT_ID}): borrador generado por agente (${AGENT_MODEL})" || { echo "sin cambios"; exit 0; }
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "spec: ${FEAT_ID} (borrador · agente)" \
            --body "Borrador de spec generado desde el prompt del usuario. Capa 0 aplicó: ${POLICIES:-(ninguna)}. **Revisión humana requerida** antes de implementar. Los gates corren en draft (consistencia normativa + cobertura EARS↔Gherkin 100%; implementación aún no exigida).")
          echo "PR: $PR_URL"
          [ -f cost_comment.md ] && gh pr comment "$PR_URL" --body-file cost_comment.md || true
